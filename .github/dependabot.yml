# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # To group all GitHub Actions updates into a single PR, uncomment the following:
    # groups:
    #   github-actions:
    #     patterns:
    #       - "*"
  - package-ecosystem: "julia"
    # test/reference is left out on purpose: its Manifest pins legacy SWG and SPSM 4.1.0
    directories:
      - "/"
      - "/docs"
      - "/test"
      - "/lib/*"
      - "/lib/*/test"
    schedule:
      interval: "weekly"
    ignore:
      # the umbrella and its libraries come from path `[sources]`, not from the registry
      - dependency-name: "StochasticWeatherGenerators*"
    # To group all Julia dependency updates into a single PR, uncomment the following:
    groups:
      julia-dependencies:
        patterns:
          - "*"
